workspace = "boringcache/benchmark-spring-ai"

[adapters.maven]
tag = "spring-ai-maven"

# Maven HTTP-cache benchmark. boringcache/one mode=maven owns the
# build-output cache, so the benchmark profile archives only the local
# dependency repository that the remote adapter does not cover.

[entries.deps]
tag = "maven-deps"
default_path = "~/.m2/repository"

[profiles.benchmark]
entries = ["deps"]
