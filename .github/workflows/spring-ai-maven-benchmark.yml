name: "Spring AI Maven Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/spring-ai-maven-benchmark.yml"
      - ".github/workflows/spring-ai-maven-fresh-benchmark.yml"
      - ".github/workflows/reusable-maven-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-maven-benchmark.yml
    with:
      benchmark_id: spring-ai-maven
      project_repo: spring-projects/spring-ai
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      java_version: "21"
      build_command: ./mvnw --batch-mode -ntp clean install -DskipTests -Dmaven.javadoc.skip=true
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-maven-benchmark.yml
    with:
      benchmark_id: spring-ai-maven
      project_repo: spring-projects/spring-ai
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      java_version: "21"
      build_command: ./mvnw --batch-mode -ntp clean install -DskipTests -Dmaven.javadoc.skip=true
    secrets: inherit
