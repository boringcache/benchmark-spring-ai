name: "Reusable Maven Benchmark"

on:
  workflow_call:
    inputs:
      benchmark_id:
        required: true
        type: string
      strategy:
        required: true
        type: string
      cache_lane:
        required: false
        type: string
        default: fresh
      cli_version:
        description: "Optional exact BoringCache CLI release tag for canary runs."
        required: false
        type: string
        default: ""
      java_version:
        required: false
        type: string
        default: "17"

env:
  BENCHMARK_ID: ${{ inputs.benchmark_id }}
  CACHE_LANE: ${{ inputs.cache_lane }}
  MAVEN_LOCAL_REPO: ~/.m2/repository

jobs:
  publish:
    name: ${{ inputs.cache_lane == 'rolling' && 'Commit' || 'Cold' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      cache_key: ${{ steps.scope.outputs.cache_key }}
      cache_scope: ${{ steps.scope.outputs.cache_scope }}
    steps:
      - name: Validate benchmark strategy
        run: |
          case "${{ inputs.strategy }}" in
            actions-cache|boringcache) ;;
            *)
              echo "Unsupported benchmark strategy: ${{ inputs.strategy }}" >&2
              exit 1
              ;;
          esac

      - name: Checkout benchmark repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned Spring AI source
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare clean Spring AI source
        run: ./scripts/prepare-source.sh base

      - name: Select the cache cohort
        id: scope
        run: |
          set -euo pipefail

          ref_slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
          ref_slug="${ref_slug#-}"
          ref_slug="${ref_slug%-}"
          ref_slug="${ref_slug:-main}"
          if [[ "$CACHE_LANE" == "rolling" ]]; then
            cache_scope="${BENCHMARK_ID}-rolling-${ref_slug}"
          else
            cache_scope="${BENCHMARK_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          fi

          ./scripts/scope-boringcache-run.sh "$cache_scope"
          source_sha="$(git rev-parse HEAD:upstream)"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
          echo "cache_key=maven-${cache_scope}-${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: ${{ inputs.java_version }}

      - name: Restore the GitHub Actions cache
        if: inputs.strategy == 'actions-cache'
        uses: actions/cache@v5
        with:
          path: ${{ env.MAVEN_LOCAL_REPO }}
          key: ${{ steps.scope.outputs.cache_key }}
          restore-keys: |
            maven-${{ steps.scope.outputs.cache_scope }}-

      - name: Configure BoringCache One for the Spring AI build
        if: inputs.strategy == 'boringcache'
        id: boringcache
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: maven
          trust-policy: publish
          working-directory: upstream
          maven-local-repo: ${{ env.MAVEN_LOCAL_REPO }}
          cache-profiles: benchmark
          fail-on-cache-error: true
          metadata-hints: phase=${{ inputs.cache_lane == 'rolling' && 'rolling' || 'fresh-cold' }}
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Build Spring AI
        working-directory: upstream
        run: ./mvnw --batch-mode -ntp clean install -DskipTests -Dmaven.javadoc.skip=true

      - name: Verify the Spring AI build
        run: |
          set -euo pipefail
          artifact="$(find upstream/spring-ai-commons/target -maxdepth 1 -type f -name 'spring-ai-commons-*.jar' -print -quit)"
          test -n "$artifact"
          test -s "$artifact"

      - name: Retain product evidence
        if: inputs.strategy == 'boringcache'
        uses: actions/upload-artifact@v6
        with:
          name: spring-ai-maven-${{ inputs.cache_lane }}-publish
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error

  restore:
    name: Warm
    needs: publish
    if: inputs.cache_lane == 'fresh'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout pinned Spring AI source
        run: |
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 4 upstream

      - name: Prepare clean Spring AI source
        run: ./scripts/prepare-source.sh warm1

      - name: Select the published cache cohort
        run: ./scripts/scope-boringcache-run.sh "${{ needs.publish.outputs.cache_scope }}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: ${{ inputs.java_version }}

      - name: Restore the exact GitHub Actions cache
        if: inputs.strategy == 'actions-cache'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.MAVEN_LOCAL_REPO }}
          key: ${{ needs.publish.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Configure BoringCache One from the published cohort
        if: inputs.strategy == 'boringcache'
        id: boringcache
        uses: boringcache/one@09e053620cda4d3472f26a3ddd181144a108e2c2 # v1.16.8
        with:
          cli-version: ${{ inputs.cli_version }}
          setup: none
          mode: maven
          trust-policy: restore
          working-directory: upstream
          maven-local-repo: ${{ env.MAVEN_LOCAL_REPO }}
          cache-profiles: benchmark
          fail-on-cache-miss: true
          fail-on-cache-error: true
          metadata-hints: phase=fresh-warm
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_NO_GIT: "true"

      - name: Build Spring AI
        working-directory: upstream
        run: ./mvnw --batch-mode -ntp clean install -DskipTests -Dmaven.javadoc.skip=true

      - name: Verify the restored Spring AI build
        run: |
          set -euo pipefail
          artifact="$(find upstream/spring-ai-commons/target -maxdepth 1 -type f -name 'spring-ai-commons-*.jar' -print -quit)"
          test -n "$artifact"
          test -s "$artifact"

      - name: Retain product evidence
        if: inputs.strategy == 'boringcache'
        uses: actions/upload-artifact@v6
        with:
          name: spring-ai-maven-fresh-restore
          path: ${{ steps.boringcache.outputs.evidence-path }}
          if-no-files-found: error
